<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Explore Nature</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <!-- Navigation section -->
    <nav>
        <div class="logo">Bonfire</div>
        <div>
            <a href="">Home</a>
            <a href="">Destinations</a>
            <a href="">Our Story</a>
            <a href="">Contact</a>
        </div>
    </nav>
    <!-- Hero section -->
    <section class="hero-contact">
        <h1>Contact Us</h1>
        <p>We would love to hear from you! Please fill out the form below to get in touch with us.</p>
    </section>
    <section>

        <!-- main section -->
        <section class="container">
            <div class="left">
                <img src="https://i.pinimg.com/1200x/84/43/e7/8443e762be8345386325df6f53304a19.jpg" alt="Contact Image">
                <h2>please get in touch</h2>
                <p>phone:0797423154</p>
                <p>email: info@bonfire.com</p>
            </div>
            <div class="right">
                <form action="">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div> 
        </section>
    </section>
</body>
</html>
